name: Build K36 Android Kernel

on:
  push:
    branches: [ lineage-18.1 ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: recursive

      - name: Install cross-compiler
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y gcc-aarch64-linux-gnu bc libssl-dev flex bison make

      - name: Build kernel Image + DTBs
        run: |
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          make lineageos_r36s_defconfig
          make -j$(nproc) Image dtbs

      - name: Collect artifacts
        run: |
          mkdir -p out
          cp arch/arm64/boot/Image out/
          cp arch/arm64/boot/dts/rockchip/rk3326-k36-android.dtb out/
          cp arch/arm64/boot/dts/rockchip/rk3326-r36s-android-panel*.dtb out/ 2>/dev/null || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: k36-android-kernel
          path: out/
          retention-days: 30
